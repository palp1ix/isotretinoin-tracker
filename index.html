<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5e6e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Мой курс">
  <meta name="description" content="Личный офлайн-трекер курса изотретиноина">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <title>Мой курс — трекер</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#today" aria-label="Мой курс — сегодня">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 40 40"><rect x="6" y="6" width="28" height="28" rx="10" fill="url(#brand-gradient)"/><path d="M14.5 23.5a5 5 0 0 1 7.1-7.1l3 3a5 5 0 0 1-7.1 7.1l-3-3Z" fill="none" stroke="white" stroke-width="2.3"/><path d="m18 24 6-6" stroke="white" stroke-width="2.3" stroke-linecap="round"/><defs><linearGradient id="brand-gradient" x1="6" y1="6" x2="34" y2="34"><stop stop-color="#f3b69f"/><stop offset="1" stop-color="#bda8e8"/></linearGradient></defs></svg></span>
        <span>Мой курс</span>
      </a>
      <div class="top-date" id="top-date"></div>
    </header>
    <main id="view" class="view" aria-live="polite"></main>
    <nav class="tabbar" aria-label="Основная навигация">
      <button class="tab active" data-tab="today"><span>📈</span><small>Сегодня</small></button>
      <button class="tab" data-tab="history"><span>🗓️</span><small>История</small></button>
      <button class="tab" data-tab="labs"><span>🧪</span><small>Анализы</small></button>
      <button class="tab" data-tab="settings"><span>⚙️</span><small>Настройки</small></button>
    </nav>
  </div>
  <div id="overlay-root"></div>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
